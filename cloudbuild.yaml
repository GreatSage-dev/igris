# ==============================================================================
# Google Cloud Build — Automated Deployment to Cloud Run
# GitLab Hackathon Partner Integration: Google Cloud Run Bonus Track
# ==============================================================================

steps:
  # 1. Build the production container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/igris-engine:$COMMIT_SHA', '.']

  # 2. Push the container image to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/igris-engine:$COMMIT_SHA']

  # 3. Deploy to Google Cloud Run with restricted network egress and memory limits
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'igris-engine'
      - '--image'
      - 'gcr.io/$PROJECT_ID/igris-engine:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '15s'

images:
  - 'gcr.io/$PROJECT_ID/igris-engine:$COMMIT_SHA'
